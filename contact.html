<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>联系 家恩宝贝</title><link rel="stylesheet" href="./community.css?v=L4.3.3">
<script defer src="./settings.js?v=L4.3.3"></script></head>
<body class="contact-body">
<header class="contact-mast"><div class="contact-bar">
  <a class="contact-back" href="./index.html" id="back-board" data-word="back">← 返回规划器</a>
  <select id="planner-language" aria-label="Language"></select>
</div></header>
<main class="contact-main"><section class="contact-card">
  <div class="community-intro"><h1 data-word="contactHeading">联系 家恩宝贝</h1>
  <p data-word="privateHint">建议会私下发给 家恩宝贝。如果希望收到回复，请留下联系方式。</p></div>
  <form class="community-form" id="contact-form">
    <label for="suggestion" data-word="suggestion">建议内容</label>
    <textarea id="suggestion" name="message" rows="6" maxlength="5000" required></textarea>
    <label for="sender" data-word="sender">你的称呼（选填）</label><input id="sender" name="name" autocomplete="nickname" maxlength="80">
    <label for="reply" data-word="reply">联系方式（选填）</label><input id="reply" name="contact" maxlength="200">
    <div class="form-actions"><button type="submit" id="send-feedback" data-word="send">发送建议</button></div>
    <p class="community-note" id="contact-state" role="status"></p>
  </form>
</section></main><script src="languages.js?v=L4.3.3"></script><script src="language.js?v=L4.3.3"></script><script defer src="community.js?v=L4.3.3"></script></body></html>
